<!DOCTYPE html>
<html>
    <head>
        <link href="https://fontlay.com/css2?family=IBM+Plex+Mono:wght@400;700&display=swap" rel="stylesheet">
        <link href="https://fontlay.com/css2?family=Zilla+Slab+Highlight:wght@400;700&display=swap" rel="stylesheet">

        <style>
            :root {
                --border-width: 2px;
                --border: var(--border-width) solid transparent;
                --size: 64px;

                

                --grid-gradient: conic-gradient(from 90deg at var(--border-width) var(--border-width), transparent 25%, #acb6c0 0);

                --light-grey-gradient: linear-gradient(to bottom right, #a5b5ca 0%, #b4c5da 35%, #b4c5da 65%, #d5dde9 100%);
                --dark-grey-gradient: linear-gradient(to bottom right, #384155 0%, #5a6572 35%, #5a6572 65%, #878f97 100%);
                --light-red-gradient: linear-gradient(to bottom right, #8b5154 0%, #c97c83 35%, #c97c83 65%, #dd99a4 100%);
                --dark-red-gradient: linear-gradient(to bottom right, #351a21 0%, #70112c 35%, #70112c 65%, #a5112c 100%);
            }
            
            #main-container {
                max-width: 900px;
                padding: 48px;
                background-color: #18202b;
            }
            
            #board {
                width: calc(8 * var(--size) + var(--border-width));
                height: calc(8 * var(--size) + var(--border-width));

                display: flex;
                flex-flow: row wrap;

                background: var(--grid-gradient) 0 0/64px 64px, var(--light-grey-gradient) 0 0/512px 512px;
            }

            #piece {
                display: flex;
                flex-flow: column nowrap;
                align-items: flex-end;

                width: min-content;

                padding-bottom: 24px;
            }

            #piece #none, #piece img {
                box-sizing: border-box;
                width: var(--size);
                height: var(--size);
                border-radius: 2px;
            }

            #fenError {
                color: red;
            }

            .piece-row {
                display: flex;
                flex-flow: row nowrap;
            }

            .cell {
                box-sizing: border-box;
                background-clip: padding-box;
                width: var(--size);
                height: var(--size);
                border-bottom: var(--border);
                border-right: var(--border);

                cursor: pointer;

                background-color: #15151d;
                background-position: center;
                background-repeat: no-repeat;
                background-size: 48px 48px;
            }

            .top {
                height: calc(var(--size) + var(--border-width));
                border-top: var(--border);
            }

            .left {
                width: calc(var(--size) + var(--border-width));
                border-left: var(--border);
            }

            .bottom {
                border-top: var(--border);
                height: calc(var(--size) + var(--border-width));
                margin-top: calc(0 - var(--border-width));
            }

            .right {
                border-left: var(--border);
                width: calc(var(--size) + var(--border-width));
                margin-left: calc(0 - var(--border-width));
            }

            .center {
                background-color: transparent;
            }

            .pusher-6 {
                width: calc(6 * var(--size));
            }

            .pusher-2 {
                width: calc(2 * var(--size));
            }

            .image {
                width: 48px;
                height: 48px;
                padding: 7px;
                text-align: center;
            }

            .empty {
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .selected {
                border: var(--border-width) solid white;
                padding: 5px;
            }

            .light-grey {
                background-color: #b4c5da;
                color: #15151d;
            }

            .dark-grey {
                background-color: #5a6572;
            }

            .light-red {
                background-color: #c97c83;
                color: #15151d;
            }

            .dark-red {
                background-color: #70112c;
            }

            body {
                display: flex;
                justify-content: center;
                align-items: center;
                width: 100vw;
                min-height: 100vh;
                margin: 0;

                background: #161e2a url('./img/horizon.jpg') center center fixed;
            }

            p, button, textarea, a, label, select, div, input {
                font-family: "IBM Plex Mono", "MS Shell Dlg \\32", monospace;
                color: white;
            }

            h1, h2, h3 {
                font-family: "Zilla Slab Highlight", serif;
                color: white;
            }

            textarea {
                background-color: #121c2c;
            }

            button, select, input[type="text"] {
                padding: 4px 8px;
                background-color: #121c2c;
            }

            p {
                max-width: 80ch;
                word-wrap: break-word;
            }
        </style>

        <script src="./fen.js"></script>

        <script>
            const myglobals = {piece: "none"};

            function nameFor(name) {
                if (name === name.toUpperCase()) {
                    return `w${name.toLowerCase()}`;
                }
                if (name === name.toLowerCase()) {
                    return `b${name}`;
                }
            }

            function updateImage(element) {
                if (myglobals.piece === "none") {
                    element.removeAttribute("data-piece");
                    element.style.backgroundImage = "";
                    return;
                }

                element.style.backgroundImage = `url('./img/${nameFor(myglobals.piece)}.png')`;
                element.setAttribute("data-piece", myglobals.piece);
            }

            function resetBoard() {
                const cells = Array.from(document.querySelectorAll(".cell"));

                Array.from(document.getElementById("piece").querySelectorAll("img")).forEach(
                    (element) => element.classList.remove("selected")
                );

                document.getElementById("piece").querySelector("#none").classList.add("selected");

                myglobals.piece = "none";
                cells.forEach(updateImage);
            }

            function init() {
                // Handle changes to the board color selector
                document.getElementById("color").addEventListener("change", (event) => {
                    event.stopPropagation();
                    const newColor = event.target.value;
                    console.log(newColor)

                    document.getElementById("board").style.background = `var(--grid-gradient) 0 0/64px 64px, ${newColor} 0 0/512px 512px`;
                });

                // Handle changes to the selected piece
                document.getElementById("piece").addEventListener("click", (event) => {
                    event.stopPropagation();

                    myglobals.piece = event.target.id;

                    Array.from(event.currentTarget.querySelectorAll(["#none", "img"])).forEach(
                        (element) => element.classList.remove("selected")
                    );
                    event.target.classList.add("selected");
                });

                // Handle board clicks
                document.getElementById("board").addEventListener("click", (event) => {
                    const target = event.target.classList.contains("cell") ? event.target : event.parent;

                    if (!target.classList.contains("cell")) {
                        return;
                    } else if (target.classList.contains("center")) {
                        Array.from(document.querySelectorAll(".center")).forEach(updateImage);
                    } else {
                        updateImage(target);
                    }

                    makeFen();
                });

                document.getElementById("fenSubmit").addEventListener("click", event => {
                    event.stopPropagation();
                    parseFen();
                });

                document.getElementById("resetBoard").addEventListener("click", event => {
                    event.stopPropagation();
                    resetBoard();
                    makeFen();
                });
            }
        </script>
    </head>
    <body>
        <div id="main-container">
            <h1>New Lemons' D2 Queen's Gambit Board &lt;-&gt; FEN converter</h1>
            <p>You might also like my <a href="./board-matcher.html" target="_blank">Queen's Gambit Grand Board Matcher</a></p>

            <h2>Cosmetic Options</h2>
            <label for="color">Select Board Colour (cosmetic)</label>
            <select name="color" id="color">
                <button><selectedcontent></selectedcontent></button>

                <option class="light-grey" value="var(--light-grey-gradient)">Light Grey</option>
                <option class="dark-grey" value="var(--dark-grey-gradient)">Dark Grey</option>
                <option class="light-red" value="var(--light-red-gradient)">Light Red</option>
                <option class="dark-red" value="var(--dark-red-gradient)">Dark Red</option>
            </select>

            <h2>Build Board</h2>

            <div id="piece">
                <div class="piece-row">
                    <div id="none" class="image empty selected">None</div>

                    <img id="B" class="image" src="./img/wb.png" />
                    <img id="K" class="image" src="./img/wk.png" />
                    <img id="N" class="image" src="./img/wn.png" />
                    <img id="P" class="image" src="./img/wp.png" />
                    <img id="Q" class="image" src="./img/wq.png" />
                    <img id="R" class="image" src="./img/wr.png" />
                </div>
                <div class="piece-row">
                    <img id="b" class="image" src="./img/bb.png" />
                    <img id="k" class="image" src="./img/bk.png" />
                    <img id="n" class="image" src="./img/bn.png" />
                    <img id="p" class="image" src="./img/bp.png" />
                    <img id="q" class="image" src="./img/bq.png" />
                    <img id="r" class="image" src="./img/br.png" />
                </div>
            </div>

            <div id="board">
                <div id="a8" class="cell top left"></div>
                <div id="b8" class="cell top"></div>
                <div id="c8" class="cell top"></div>
                <div id="d8" class="cell top"></div>
                <div id="e8" class="cell top"></div>
                <div id="f8" class="cell top"></div>
                <div id="g8" class="cell top"></div>
                <div id="h8" class="cell top"></div>

                <div id="a7" class="cell left"></div>
                <div class="pusher-6"></div>
                <div id="h7" class="cell right"></div>

                <div id="a6" class="cell left"></div>
                <div class="pusher-6"></div>
                <div id="h6" class="cell right"></div>

                <div id="a5" class="cell left"></div>
                <div class="pusher-2"></div>
                <div id="d5" class="center cell bottom right"></div>
                <div id="e5" class="center cell bottom"></div>
                <div class="pusher-2"></div>
                <div id="h5" class="cell right"></div>

                <div id="a4" class="cell left"></div>
                <div class="pusher-2"></div>
                <div id="d4" class="center cell right"></div>
                <div id="e4" class="center cell"></div>
                <div class="pusher-2"></div>
                <div id="h4" class="cell right"></div>

                <div id="a3" class="cell left"></div>
                <div class="pusher-6"></div>
                <div id="h3" class="cell right"></div>

                <div id="a2" class="cell left"></div>
                <div class="pusher-6"></div>
                <div id="h2" class="cell right"></div>

                <div id="a1" class="cell left"></div>
                <div id="b1" class="cell bottom"></div>
                <div id="c1" class="cell bottom"></div>
                <div id="d1" class="cell bottom"></div>
                <div id="e1" class="cell bottom"></div>
                <div id="f1" class="cell bottom"></div>
                <div id="g1" class="cell bottom"></div>
                <div id="h1" class="cell"></div>
            </div>

            <p>
                <b>Resulting FEN:</b> <b id="fen">8/8/8/8/8/8/8/8</b>
            </p>

            <div>
                <button id="resetBoard">Reset Board</button>
            </div>

            <div>
                <h2>Fill board from FEN</h2>
                <input id="fenInput" name="fenInput" type="text" placeholder="Paste a FEN..." />
                <button id="fenSubmit">Parse</button>
                <div id="fenError"></div>
            </div>

        </div>
        <script>
            window.onload = init();
        </script>
    </body>
</html>
