<!DOCTYPE html>
<html>
    <head>
        <link href="https://fontlay.com/css2?family=IBM+Plex+Mono:wght@400;700&display=swap" rel="stylesheet">
        <link href="https://fontlay.com/css2?family=Zilla+Slab+Highlight:wght@400;700&display=swap" rel="stylesheet">

        <link href="./index.css" rel="stylesheet">

        <script src="./notations.js"></script>

        <script>
            const myglobals = {
                piece: "none",
                COL_NAMES: ["a", "b", "c", "d", "e", "f", "g", "h"]
            };

            function imageNameFor(fenChar) {
                if (fenChar === fenChar.toUpperCase()) {
                    return `w${fenChar.toLowerCase()}`;
                }
                if (fenChar === fenChar.toLowerCase()) {
                    return `b${fenChar}`;
                }
            }

            function updateImage(element) {
                const selectedPiece = document.querySelector("#piece .selected").id;
                if (selectedPiece === "none") {
                    element.removeAttribute("data-piece");
                    element.style.backgroundImage = "";
                    return;
                }

                element.style.backgroundImage = `url('./img/${imageNameFor(selectedPiece)}.png')`;
                element.setAttribute("data-piece", selectedPiece);
            }

            function writePieceToCell(cell, fenChar) {
                console.log(fenChar);
                if (!fenChar) {
                    cell.removeAttribute("data-piece");
                    cell.style.backgroundImage = "";
                    return;
                } 

                cell.style.backgroundImage = `url('./img/${imageNameFor(fenChar)}.png')`;
                cell.setAttribute("data-piece", fenChar);
            }

            function colourToShorthand(colour) {
                switch (colour) {
                    case "var(--dark-red-gradient)":
                        return "r";
                    case "var(--light-red-gradient)":
                        return "R";
                    case "var(--dark-grey-gradient)":
                        return "g";  
                    case "var(--light-grey-gradient)":
                    default:
                        return "G";
                }
            }

            function shorthandToColour(shorthand) {
                switch (shorthand) {
                    case "r": 
                        return "var(--dark-red-gradient)";
                    case "R":
                        return "var(--light-red-gradient)";
                    case "g":
                        return "var(--dark-grey-gradient)";
                    case "G":
                    default:
                        return "var(--light-grey-gradient)";
                }
            }

            function getSelectedColourShorthand() {
                const colourSelect = document.getElementById("color");

                return colourToShorthand(colourSelect.value);
            }

            function writeBoardFromFenArray(fenArray) {
                fenArray.forEach((fenRow, y) => {
                    fenRow.forEach((fenChar, x) => {
                        const rowNumber = 8 - y;
                        const colName = myglobals.COL_NAMES[x];
                        const cell = document.getElementById("board").querySelector(`#${colName}${rowNumber}`);

                        if (!cell) return;

                        writePieceToCell(cell, fenChar);
                    })
                })
            }

            function writeColourFromShorthand(shorthand) {
                const select = document.getElementById("color");

                select.value = shorthandToColour(shorthand);
                select.dispatchEvent(new Event("change"));
            }

            function writeQRBoardFromString(qrString) {
                const qrBinary = parseInt(qrString, 16).toString(2).split("");
                qrBinary.forEach((qrBit, i) => {
                    const col = Math.floor(i / 4);
                    const row = 3 - (i % 4);

                    const inputCell = document.querySelector(`#i${row}${col}`);

                    if ((qrBit === "1") === inputCell.classList.contains("black")) {
                        inputCell.click();
                    }
                })
            }

            function writeQRFromString(qrString) {
                const checkbox = document.getElementById("has-qr")
                if (qrString === "-1" && checkbox.checked) {
                    // Wipe board then uncheck
                    writeQRBoardFromString("0000");
                    checkbox.checked = false;
                    checkbox.dispatchEvent(new Event("change"));
                } 
                else if (qrString !== "-1") {
                    if (!checkbox.checked) {
                        // Check box before filling board
                        checkbox.checked = true;
                        checkbox.dispatchEvent(new Event("change"));
                    } 
                    
                    setTimeout(() => writeQRBoardFromString(qrString), 50);
                }
            }

            function readFenInput() {
                const fenInput = document.getElementById("fen-input");
                const fenError = document.getElementById("fen-error");

                const fenString = fenInput.value;

                if (!isFen(fenString)) {
                    fenError.textContent = `${fenString} is not a valid FEN`;
                    fenInput.value = "";

                    return;
                }

                fenError.textContent = "";
                fenInput.value = "";

                const fenArray = makeArrayFromFen(fenString);

                writeBoardFromFenArray(fenArray);
            }

            function readLefenInput() {
                const lefenInput = document.getElementById("lefen-input");
                const lefenError = document.getElementById("lefen-error");

                const lefenString = lefenInput.value;

                if (!isLefen(lefenString)) {
                    lefenError.textContent = `${lefenString} is not a valid LEFEN`;
                    lefenInput.value = "";

                    return;
                }

                lefenError.textContent = "";
                lefenInput.value = "";

                const {fenArray, colour, qrString} = parseLefen(lefenString);

                writeBoardFromFenArray(fenArray);
                writeColourFromShorthand(colour);
                writeQRFromString(qrString);
            }

            function readLeonInput() {
                const leonInput = document.getElementById("leon-input");
                const leonError = document.getElementById("leon-error");

                const leonString = leonInput.value;

                if (!isLeon(leonString)) {
                    leonError.textContent = `${leonString} is not a valid LEON`;
                    leonInput.value = "";

                    return;
                }

                leonError.textContent = "";
                leonInput.value = "";

                const {fenArray, colour, qrString} = parseLeon(leonString);

                writeBoardFromFenArray(fenArray);
                writeColourFromShorthand(colour);
                writeQRFromString(qrString);
            }

            function updateNotations() {
                const boardCells = Array.from(document.querySelectorAll(".cell"))
                const fenArray = readFenArrayFromCells(boardCells);

                const hasQr = document.getElementById("has-qr").checked;
                const qrCells = Array.from(document.getElementById("qr-board").querySelectorAll(".qr-cell"));
                const qrString = hasQr ? readQRFromCells(qrCells) : "-1";

                const colour = getSelectedColourShorthand();
                
                document.getElementById("fen").textContent = makeFenFromArray(fenArray);
                document.getElementById("lefen").textContent = makeLefenFromArray(fenArray, colour, qrString);
                document.getElementById("leon").textContent = makeLeonFromArray(fenArray, colour, qrString);
            }

            function resetBoard() {
                Array.from(document.getElementById("piece").querySelectorAll("img")).forEach(
                    (element) => element.classList.remove("selected")
                );

                document.getElementById("piece").querySelector("#none").classList.add("selected");

                myglobals.piece = "none";
                const cells = Array.from(document.querySelectorAll(".cell"));
                cells.forEach(updateImage);
            }

            function init() {
                // Handle changes to the board color selector
                document.getElementById("color").addEventListener("change", (event) => {
                    event.stopPropagation();
                    const newColor = event.target.value;

                    document.getElementById("board").style.background = `var(--grid-gradient) 0 0/64px 64px, ${newColor} 0 0/512px 512px`;
                    
                    updateNotations();
                });

                document.getElementById("has-qr").addEventListener("change", (event) => {
                    if (event.target.checked) {
                        document.getElementById("qr-input").classList.add("visible");
                        document.getElementById("qr-board").classList.add("visible");
                    } else {
                        document.getElementById("qr-input").classList.remove("visible");
                        document.getElementById("qr-board").classList.remove("visible");
                    }

                    updateNotations();
                })

                // Handle changes to the QR input
                document.getElementById("qr-input").addEventListener("click", (event) => {
                    event.stopPropagation();

                    const cellId = event.target.getAttribute("data-cell");
                    
                    event.target.classList.toggle("black");
                    document.getElementById("qr-board").querySelector(`#b${cellId}`).classList.toggle("black");

                    updateNotations();
                })

                // Handle changes to the selected piece
                document.getElementById("piece").addEventListener("click", (event) => {
                    event.stopPropagation();

                    myglobals.piece = event.target.id;

                    Array.from(event.currentTarget.querySelectorAll(["#none", "img"])).forEach(
                        (element) => element.classList.remove("selected")
                    );
                    event.target.classList.add("selected");
                });

                // Handle board clicks
                document.getElementById("board").addEventListener("click", (event) => {
                    const target = event.target.classList.contains("cell") ? event.target : event.parent;

                    if (!target.classList.contains("cell")) {
                        return;
                    } else if (target.classList.contains("center")) {
                        Array.from(document.querySelectorAll(".center")).forEach(updateImage);
                    } else {
                        updateImage(target);
                    }

                    updateNotations();
                });

                // Draw board from submitted FEN
                document.getElementById("fen-submit").addEventListener("click", event => {
                    event.stopPropagation();
                    readFenInput();
                    updateNotations();
                });

                document.getElementById("lefen-submit").addEventListener("click", event => {
                    event.stopPropagation();
                    readLefenInput();
                    updateNotations();
                });

                document.getElementById("leon-submit").addEventListener("click", event => {
                    event.stopPropagation();
                    readLeonInput();
                    updateNotations();
                });

                // Empty the board
                document.getElementById("reset-board").addEventListener("click", event => {
                    event.stopPropagation();
                    resetBoard();
                    updateNotations();
                });
            }
        </script>
    </head>
    <body>
        <div id="main-container">
            <h1>New Lemons' D2 Queen's Gambit Board &lt;-&gt; FEN converter</h1>
            <p>You might also like my <a href="./board-matcher.html" target="_blank">Queen's Gambit Grand Board Matcher</a></p>

            <h2>Fill Board from Notation</h2>

            <div id="input-fields">
                <div>
                    <label for="fen-input">FEN</label>
                    <div>
                        <input id="fen-input" name="fen-input" type="text" placeholder="Paste a FEN..." />
                        <button id="fen-submit">Parse</button>
                    </div>
                    <div id="fen-error"></div>
                </div>

                <div>
                    <label for="lefen-input">LEFEN</label>
                    <div>
                        <input id="lefen-input" name="lefen-input" type="text" placeholder="Paste a LEFEN..." />
                        <button id="lefen-submit">Parse</button>
                    </div>
                    <div id="lefen-error"></div>
                </div>

                <div>
                    <label for="leon-input">LEON</label>
                    <div>
                        <input id="leon-input" name="leon-input" type="text" placeholder="Paste a LEON..." />
                        <button id="leon-submit">Parse</button>
                    </div>
                    <div id="leon-error"></div>
                </div>
            </div>

            <h2>Build Board</h2>

            <div style="margin: -4px 0 32px;">
                <button id="reset-board">Reset Board</button>
            </div>

            <div id="piece">
                <div class="piece-row">
                    <div id="none" class="image empty selected">None</div>

                    <img id="B" class="image" src="./img/wb.png" />
                    <img id="K" class="image" src="./img/wk.png" />
                    <img id="N" class="image" src="./img/wn.png" />
                    <img id="P" class="image" src="./img/wp.png" />
                    <img id="Q" class="image" src="./img/wq.png" />
                    <img id="R" class="image" src="./img/wr.png" />
                </div>
                <div class="piece-row">
                    <img id="b" class="image" src="./img/bb.png" />
                    <img id="k" class="image" src="./img/bk.png" />
                    <img id="n" class="image" src="./img/bn.png" />
                    <img id="p" class="image" src="./img/bp.png" />
                    <img id="q" class="image" src="./img/bq.png" />
                    <img id="r" class="image" src="./img/br.png" />
                </div>
            </div>

            <div id="board">
                <div id="qr-board">
                    <div id="b00" class="qr-cell"></div>
                    <div id="b10" class="qr-cell"></div>
                    <div id="b20" class="qr-cell"></div>
                    <div id="b30" class="qr-cell"></div>
                
                    <div id="b01" class="qr-cell"></div>
                    <div id="b11" class="qr-cell"></div>
                    <div id="b21" class="qr-cell"></div>
                    <div id="b31" class="qr-cell"></div>
                
                    <div id="b02" class="qr-cell"></div>
                    <div id="b12" class="qr-cell"></div>
                    <div id="b22" class="qr-cell"></div>
                    <div id="b32" class="qr-cell"></div>
                
                    <div id="b03" class="qr-cell"></div>
                    <div id="b13" class="qr-cell"></div>
                    <div id="b23" class="qr-cell"></div>
                    <div id="b33" class="qr-cell"></div>
                </div>

                <div id="center">
                    <div id="d5" class="center cell bottom right"></div>
                    <div id="e5" class="center cell bottom"></div>
                    <div id="d4" class="center cell right"></div>
                    <div id="e4" class="center cell"></div>
                </div>

                <div id="a8" class="cell top left"></div>
                <div id="b8" class="cell top"></div>
                <div id="c8" class="cell top"></div>
                <div id="d8" class="cell top"></div>
                <div id="e8" class="cell top"></div>
                <div id="f8" class="cell top"></div>
                <div id="g8" class="cell top"></div>
                <div id="h8" class="cell top"></div>

                <div id="a7" class="cell left"></div>
                <div class="pusher-6"></div>
                <div id="h7" class="cell right"></div>

                <div id="a6" class="cell left"></div>
                <div class="pusher-6"></div>
                <div id="h6" class="cell right"></div>

                <div id="a5" class="cell left"></div>
                <div class="pusher-6"></div>
                <div id="h5" class="cell right"></div>

                <div id="a4" class="cell left"></div>
                <div class="pusher-6"></div>
                <div id="h4" class="cell right"></div>

                <div id="a3" class="cell left"></div>
                <div class="pusher-6"></div>
                <div id="h3" class="cell right"></div>

                <div id="a2" class="cell left"></div>
                <div class="pusher-6"></div>
                <div id="h2" class="cell right"></div>

                <div id="a1" class="cell left"></div>
                <div id="b1" class="cell bottom"></div>
                <div id="c1" class="cell bottom"></div>
                <div id="d1" class="cell bottom"></div>
                <div id="e1" class="cell bottom"></div>
                <div id="f1" class="cell bottom"></div>
                <div id="g1" class="cell bottom"></div>
                <div id="h1" class="cell"></div>
            </div>

            <p>
                <b>Resulting FEN:</b> <b id="fen">8/8/8/8/8/8/8/8</b>
            </p>

            <h2>ARG-Specific Options</h2>

            <div>
                <label for="color">Select Board Colour</label>
                <select name="color" id="color" autocomplete="off">
                    <option class="light-grey" value="var(--light-grey-gradient)">Light Grey</option>
                    <option class="dark-grey" value="var(--dark-grey-gradient)">Dark Grey</option>
                    <option class="light-red" value="var(--light-red-gradient)">Light Red</option>
                    <option class="dark-red" value="var(--dark-red-gradient)">Dark Red</option>
                </select>
            </div>

            <div>
                <label for="has-qr">Board has QR:</label>
                <input id="has-qr" name="has-qr" type="checkbox" autocomplete="off" />
            </div>

            <div id="qr-input">
                <div id="i00" data-cell="00" class="qr-cell"></div>
                <div id="i10" data-cell="10" class="qr-cell"></div>
                <div id="i20" data-cell="20" class="qr-cell"></div>
                <div id="i30" data-cell="30" class="qr-cell"></div>
            
                <div id="i01" data-cell="01" class="qr-cell"></div>
                <div id="i11" data-cell="11" class="qr-cell"></div>
                <div id="i21" data-cell="21" class="qr-cell"></div>
                <div id="i31" data-cell="31" class="qr-cell"></div>
            
                <div id="i02" data-cell="02" class="qr-cell"></div>
                <div id="i12" data-cell="12" class="qr-cell"></div>
                <div id="i22" data-cell="22" class="qr-cell"></div>
                <div id="i32" data-cell="32" class="qr-cell"></div>
            
                <div id="i03" data-cell="03" class="qr-cell"></div>
                <div id="i13" data-cell="13" class="qr-cell"></div>
                <div id="i23" data-cell="23" class="qr-cell"></div>
                <div id="i33" data-cell="33" class="qr-cell"></div>
            </div>

            <p>
                Resulting LEFEN: <span id="lefen">8/8/8/8/8/8/8/8/G/-1</span>
            </p>

            <p>
                Resulting LEON: <span id="leon">8/8/8/8/1/G/-1</span>
            </p>

        </div>
        <script>
            window.onload = init();
        </script>
    </body>
</html>
